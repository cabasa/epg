name: Run WebGrab EPG (server)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  run-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Connect runner to your tailnet
      - name: Tailscale up
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # SSH to server over the tailnet IP
      - name: Run EPG on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -eux
            cd ~/epg
            ./run_epg.sh
