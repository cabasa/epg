name: Run WebGrab EPG (server)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 */2 * *"

jobs:
  run-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Connect runner to your tailnet using OAuth
      - name: Tailscale up
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-runner
          ping: ${{ secrets.SSH_HOST }}

      # SSH to server over the tailnet
      - name: Run EPG on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -eux
            cd ~/epg
            ./run_epg.sh
