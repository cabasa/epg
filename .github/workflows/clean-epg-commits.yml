name: Clean EPG Commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep latest epg.xml from HEAD
        run: |
          set -euo pipefail
          git show HEAD:epg.xml > /tmp/epg.xml

      - name: Find boundary (commit before latest EPG update)
        id: boundary
        run: |
          set -euo pipefail

          LATEST_EPG_SHA="$(git log -n 1 --pretty=format:%H --grep='^EPG update \(server\)$' || true)"
          if [ -z "$LATEST_EPG_SHA" ]; then
            echo "No 'EPG update (server)' commits found. Nothing to clean."
            echo "boundary_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BOUNDARY_SHA="$(git rev-parse "${LATEST_EPG_SHA}^")"
          echo "Latest EPG commit: $LATEST_EPG_SHA"
          echo "Boundary commit: $BOUNDARY_SHA"
          echo "boundary_sha=$BOUNDARY_SHA" >> "$GITHUB_OUTPUT"

      - name: Rewrite history (snapshot + keep non-EPG commits)
        run: |
          set -euo pipefail

          BOUNDARY_SHA="${{ steps.boundary.outputs.boundary_sha }}"
          if [ -z "$BOUNDARY_SHA" ]; then
            echo "Nothing to do."
            exit 0
          fi

          # List commits after boundary (oldest -> newest)
          git rev-list --reverse "${BOUNDARY_SHA}..HEAD" > /tmp/all_commits.txt

          # Keep everything except "EPG update (server)"
          : > /tmp/keep_commits.txt
          while IFS= read -r sha; do
            subj="$(git log -1 --pretty=format:%s "$sha")"
            if [ "$subj" != "EPG update (server)" ]; then
              echo "$sha" >> /tmp/keep_commits.txt
            fi
          done < /tmp/all_commits.txt

          echo "Commits to keep:"
          cat /tmp/keep_commits.txt || true

          # Reset to boundary
          git reset --hard "$BOUNDARY_SHA"

          # Apply latest epg.xml and commit snapshot (only if it changes)
          cp /tmp/epg.xml ./epg.xml
          git add epg.xml

          if git diff --cached --quiet; then
            echo "epg.xml identical after reset; no snapshot commit needed."
          else
            git commit -m "EPG snapshot (latest)"
          fi

          # Cherry-pick kept commits
          if [ -s /tmp/keep_commits.txt ]; then
            while IFS= read -r sha; do
              git cherry-pick "$sha"
            done < /tmp/keep_commits.txt
          fi

      - name: Force push cleaned history to main
        run: |
          set -euo pipefail
          git push origin HEAD:main --force
