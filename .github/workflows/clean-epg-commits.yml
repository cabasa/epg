name: Clean EPG Commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Keep latest epg.xml from current HEAD
        run: |
          set -euo pipefail
          LATEST_SHA="$(git rev-parse HEAD)"
          mkdir -p /tmp/keep
          git show "${LATEST_SHA}:epg.xml" > /tmp/keep/epg.xml

      - name: Find last non-EPG-update commit
        id: base
        run: |
          set -euo pipefail
          BASE_SHA="$(git log --invert-grep --grep='^EPG update \(server\)$' -n 1 --pretty=format:%H)"

          if [ -z "${BASE_SHA:-}" ]; then
            echo "Could not find a non-EPG-update commit. Aborting to avoid rewriting to nothing."
            exit 1
          fi

          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Reset history to base commit and re-apply latest epg.xml only
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.base.outputs.base_sha }}"
          echo "Base commit: ${BASE_SHA}"

          # Reset branch to the last non-auto commit
          git reset --hard "${BASE_SHA}"

          # Restore latest epg.xml only
          cp /tmp/keep/epg.xml ./epg.xml
          git add epg.xml

          if git diff --cached --quiet; then
            echo "No changes after cleanup. Nothing to commit."
            exit 0
          fi

          git commit -m "EPG update (latest snapshot)"

      - name: Force push cleaned history to main
        run: |
          set -euo pipefail
          git push origin HEAD:main --force-with-lease
