name: Clean EPG Commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Keep latest epg.xml from HEAD
        run: |
          set -euo pipefail
          git show HEAD:epg.xml > /tmp/epg.xml

      - name: Find boundary (commit before latest epg.xml-changing commit)
        id: boundary
        run: |
          set -euo pipefail

          LATEST_EPG_SHA="$(git rev-list -n 1 HEAD -- epg.xml || true)"
          if [ -z "$LATEST_EPG_SHA" ]; then
            echo "No commits found that touch epg.xml. Nothing to clean."
            echo "boundary_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BOUNDARY_SHA="$(git rev-parse "${LATEST_EPG_SHA}^")"
          echo "Latest epg.xml commit: $LATEST_EPG_SHA"
          echo "Boundary commit: $BOUNDARY_SHA"
          echo "boundary_sha=$BOUNDARY_SHA" >> "$GITHUB_OUTPUT"

      - name: Rewrite history (snapshot + keep non-epg/logs commits)
        run: |
          set -euo pipefail

          BOUNDARY_SHA="${{ steps.boundary.outputs.boundary_sha }}"
          if [ -z "$BOUNDARY_SHA" ]; then
            echo "Nothing to do."
            exit 0
          fi

          git rev-list --reverse "${BOUNDARY_SHA}..HEAD" > /tmp/all_commits.txt

          : > /tmp/keep_commits.txt
          while IFS= read -r sha; do
            files="$(git show --name-only --pretty=format: "$sha")"

            # Skip commits that touch epg.xml
            if echo "$files" | grep -qx "epg.xml"; then
              continue
            fi

            # Skip commits that touch logs/ (prevents conflicts)
            if echo "$files" | grep -q '^logs/'; then
              continue
            fi

            echo "$sha" >> /tmp/keep_commits.txt
          done < /tmp/all_commits.txt

          echo "Commits to keep (do not touch epg.xml or logs/):"
          cat /tmp/keep_commits.txt || true

          git reset --hard "$BOUNDARY_SHA"

          cp /tmp/epg.xml ./epg.xml
          git add epg.xml

          if git diff --cached --quiet; then
            echo "epg.xml identical after reset; no snapshot commit needed."
          else
            git commit -m "EPG snapshot (latest)"
          fi

          if [ -s /tmp/keep_commits.txt ]; then
            while IFS= read -r sha; do
              git cherry-pick "$sha"
            done < /tmp/keep_commits.txt
          fi

      - name: Force push cleaned history to main
        run: |
          set -euo pipefail
          git push origin HEAD:main --force
