name: Clean EPG Commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep latest epg.xml from current HEAD
        run: |
          set -euo pipefail
          LATEST_SHA="$(git rev-parse HEAD)"
          mkdir -p /tmp/keep
          git show "${LATEST_SHA}:epg.xml" > /tmp/keep/epg.xml

      - name: Find last commit that did NOT change epg.xml
        id: base
        run: |
          set -euo pipefail

          # List commits that touched epg.xml (newest first)
          mapfile -t EPG_COMMITS < <(git rev-list HEAD -- epg.xml)

          if [ "${#EPG_COMMITS[@]}" -eq 0 ]; then
            echo "No commits found that touch epg.xml. Nothing to clean."
            exit 0
          fi

          # Walk history from HEAD and pick the first commit that is NOT in EPG_COMMITS
          BASE_SHA=""
          while read -r sha; do
            skip=false
            for e in "${EPG_COMMITS[@]}"; do
              if [ "$sha" = "$e" ]; then
                skip=true
                break
              fi
            done
            if [ "$skip" = false ]; then
              BASE_SHA="$sha"
              break
            fi
          done < <(git rev-list HEAD)

          if [ -z "$BASE_SHA" ]; then
            echo "Could not find a base commit that doesn't touch epg.xml."
            echo "This can happen if every commit touches epg.xml."
            exit 1
          fi

          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Base commit: ${BASE_SHA}"

      - name: Reset to base and apply latest epg.xml
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.base.outputs.base_sha }}"

          git reset --hard "${BASE_SHA}"

          cp /tmp/keep/epg.xml ./epg.xml
          git add epg.xml

          if git diff --cached --quiet; then
            echo "No changes after cleanup. Nothing to commit."
            exit 0
          fi

          git commit -m "EPG snapshot (latest)"

      - name: Force push cleaned history to main
        run: |
          set -euo pipefail
          git push origin HEAD:main --force
