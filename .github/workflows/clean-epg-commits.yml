name: Clean EPG Commits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep latest epg.xml from current HEAD
        run: |
          set -euo pipefail
          LATEST_SHA="$(git rev-parse HEAD)"
          mkdir -p /tmp/keep
          git show "${LATEST_SHA}:epg.xml" > /tmp/keep/epg.xml

      - name: Find last non-EPG-related commit
        id: base
        run: |
          set -euo pipefail

          # Treat these as "auto/epg churn" commits that we want to squash away
          # Add more patterns here if you introduce new automated messages later.
          BASE_SHA="$(
            git log -n 1 --pretty=format:%H \
              --invert-grep \
              --grep='^EPG update \(server\)$' \
              --grep='^Update latest-run\.log \(snapshot\)$' \
              --grep='^EPG snapshot \(latest\)$'
          )"

          if [ -z "${BASE_SHA}" ]; then
            echo "Could not find a non-EPG-related base commit."
            exit 1
          fi

          echo "base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Base commit: ${BASE_SHA}"

      - name: Reset to base and apply latest epg.xml
        run: |
          set -euo pipefail
          BASE_SHA="${{ steps.base.outputs.base_sha }}"

          git reset --hard "${BASE_SHA}"

          # Restore latest EPG snapshot only
          cp /tmp/keep/epg.xml ./epg.xml

          git add epg.xml

          if git diff --cached --quiet; then
            echo "No changes after cleanup. Nothing to commit."
            exit 0
          fi

          git commit -m "EPG snapshot (latest)"

      - name: Force push cleaned history to main
        run: |
          set -euo pipefail
          git push origin HEAD:main --force
